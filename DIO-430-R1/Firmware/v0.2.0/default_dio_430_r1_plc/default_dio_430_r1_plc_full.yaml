# DIO-430-R1 — ESPHome Modbus map (Phase A block layout)
# Firmware v0.2.0+ (CFG 0x000A): one FC=04 read of Input Registers 0..29 per poll.
#
# Input Registers (FC=04, read) — contiguous 0..29:
#   0 DI_STATE_MASK (bits 0..3 = DI1..4)
#   1 RLY_STATE_MASK (bits 0..2)
#   2 BTN_STATE_MASK (bits 0..1)
#   3 LED_STATE_MASK (bits 0..2)
#   4 STATUS_FLAGS (bit0=localLogic, bit1=linkOk, bit3=cfgDirty)
#   5 LOCK_MASK (bits 0..3 = lockLocal DI1..4)
#   6..29 event counters (EVT_BASE=6, source*4+type)
#
# Coils (FC=05/15): 0..2 relays, 3 ALL_OFF, 4 LOCAL_LOGIC, 5 IDENTIFY,
#   6 SAVE_CFG, 7 REBOOT, 8..10 LED_HA, 11..14 DI_LOCK
#
# Holding (FC=03) — config/identity; do not poll in the main loop.

substitutions:
  dio_id: dio
  dio_address: "3"
  dio_prefix: "DIO"
  dio_update_interval: 1s
  dio_command_throttle: 50ms

modbus_controller:
  - id: ${dio_id}
    address: ${dio_address}
    modbus_id: modbus_bus
    command_throttle: ${dio_command_throttle}
    update_interval: ${dio_update_interval}

# ── State block (FC=04) — ESPHome merges contiguous reads into one request ──
binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI1"
    register_type: read
    address: 0
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI2"
    register_type: read
    address: 0
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI3"
    register_type: read
    address: 0
    bitmask: 0x0004
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI4"
    register_type: read
    address: 0
    bitmask: 0x0008

  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Relay 1"
    id: ${dio_id}_rly1_state
    register_type: read
    address: 1
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Relay 2"
    id: ${dio_id}_rly2_state
    register_type: read
    address: 1
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Relay 3"
    id: ${dio_id}_rly3_state
    register_type: read
    address: 1
    bitmask: 0x0004

  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Btn1"
    register_type: read
    address: 2
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Btn2"
    register_type: read
    address: 2
    bitmask: 0x0002

  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} LED1"
    register_type: read
    address: 3
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} LED2"
    register_type: read
    address: 3
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} LED3"
    register_type: read
    address: 3
    bitmask: 0x0004

  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Local logic"
    register_type: read
    address: 4
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Link OK"
    register_type: read
    address: 4
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Config dirty"
    register_type: read
    address: 4
    bitmask: 0x0008

  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI1 lock"
    register_type: read
    address: 5
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI2 lock"
    register_type: read
    address: 5
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI3 lock"
    register_type: read
    address: 5
    bitmask: 0x0004
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI4 lock"
    register_type: read
    address: 5
    bitmask: 0x0008

sensor:
  # Event counters DI1..4, Btn1..2 × single/double/long (registers 6..29)
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI1 single"
    register_type: read
    address: 6
    unit_of_measurement: "events"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI1 double"
    register_type: read
    address: 7
    unit_of_measurement: "events"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI1 long"
    register_type: read
    address: 9
    unit_of_measurement: "events"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI2 single"
    register_type: read
    address: 10
    unit_of_measurement: "events"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI2 long"
    register_type: read
    address: 13
    unit_of_measurement: "events"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI3 single"
    register_type: read
    address: 14
    unit_of_measurement: "events"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI4 single"
    register_type: read
    address: 18
    unit_of_measurement: "events"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Btn1 single"
    register_type: read
    address: 22
    unit_of_measurement: "events"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Btn1 long"
    register_type: read
    address: 25
    unit_of_measurement: "events"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Btn2 single"
    register_type: read
    address: 26
    unit_of_measurement: "events"
    accuracy_decimals: 0

switch:
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Relay 1"
    id: ${dio_id}_relay1
    register_type: coil
    address: 0
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Relay 2"
    id: ${dio_id}_relay2
    register_type: coil
    address: 1
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Relay 3"
    id: ${dio_id}_relay3
    register_type: coil
    address: 2
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Local logic"
    register_type: coil
    address: 4
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} LED1 HA"
    register_type: coil
    address: 8
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} LED2 HA"
    register_type: coil
    address: 9
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} LED3 HA"
    register_type: coil
    address: 10
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI1 child lock"
    register_type: coil
    address: 11
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI2 child lock"
    register_type: coil
    address: 12
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI3 child lock"
    register_type: coil
    address: 13
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI4 child lock"
    register_type: coil
    address: 14

button:
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} All off"
    register_type: coil
    address: 3
    write_lambda: |-
      return {true};
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Identify"
    register_type: coil
    address: 5
    write_lambda: |-
      return {true};
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Save config"
    register_type: coil
    address: 6
    write_lambda: |-
      return {true};
