##
## DIO-430-R1 — ESPHome Modbus package (Phase A block map, v0.2.0 CFG 0x000A)
##
## Single package file — include from your ESPHome YAML:
##   packages:
##     dio: github://isystemsautomation/homemaster-dev/DIO-430-R1/Firmware/v0.2.0/default_dio_430_r1_plc/default_dio_430_r1_plc.yaml
##
## Requires global `modbus:` with id `modbus_bus`. If UART/Modbus are not defined yet, uncomment:
# uart:
#   id: rs485_uart
#   tx_pin: GPIO4
#   rx_pin: GPIO5
#   baud_rate: 19200
#   parity: NONE
#   stop_bits: 1
# modbus:
#   id: modbus_bus
#   uart_id: rs485_uart
##
## Input Registers (FC=04, read) — contiguous 0..29 (one merged poll per cycle):
##   0 DI_STATE_MASK · 1 RLY_STATE_MASK · 2 BTN_STATE_MASK · 3 LED_STATE_MASK
##   4 STATUS_FLAGS (bit0=localLogic, bit1=linkOk, bit3=cfgDirty) · 5 LOCK_MASK
##   6..29 event counters (EVT_BASE=6, source*4+type; sources DI1..4=0..3, Btn1..2=4..5)
##
## Coils (FC=05/15): 0..2 relays · 3 ALL_OFF · 4 LOCAL_LOGIC · 5 IDENTIFY
##   6 SAVE_CFG · 7 REBOOT · 8..10 LED_HA · 11..14 DI_LOCK
##
## Holding (FC=03) — config/identity; do not poll in the main loop.

substitutions:
  dio_id: dio
  dio_address: "3"
  dio_prefix: "DIO"
  dio_update_interval: 1s
  dio_command_throttle: 50ms

modbus_controller:
  - id: ${dio_id}
    address: ${dio_address}
    modbus_id: modbus_bus
    command_throttle: ${dio_command_throttle}
    update_interval: ${dio_update_interval}

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI1"
    register_type: read
    address: 0
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI2"
    register_type: read
    address: 0
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI3"
    register_type: read
    address: 0
    bitmask: 0x0004
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI4"
    register_type: read
    address: 0
    bitmask: 0x0008

  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Relay 1"
    id: ${dio_id}_rly1_state
    register_type: read
    address: 1
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Relay 2"
    id: ${dio_id}_rly2_state
    register_type: read
    address: 1
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Relay 3"
    id: ${dio_id}_rly3_state
    register_type: read
    address: 1
    bitmask: 0x0004

  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Btn1"
    register_type: read
    address: 2
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Btn2"
    register_type: read
    address: 2
    bitmask: 0x0002

  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} LED1"
    register_type: read
    address: 3
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} LED2"
    register_type: read
    address: 3
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} LED3"
    register_type: read
    address: 3
    bitmask: 0x0004

  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Local logic"
    register_type: read
    address: 4
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Link OK"
    register_type: read
    address: 4
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Config dirty"
    register_type: read
    address: 4
    bitmask: 0x0008

  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI1 lock"
    register_type: read
    address: 5
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI2 lock"
    register_type: read
    address: 5
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI3 lock"
    register_type: read
    address: 5
    bitmask: 0x0004
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI4 lock"
    register_type: read
    address: 5
    bitmask: 0x0008

sensor:
