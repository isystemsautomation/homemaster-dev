##
## DIO-430-R1 — ESPHome Modbus package (v0.3.0-beta)
##
## Single package file — include from your ESPHome YAML:
##   packages:
##     dio: github://isystemsautomation/homemaster-dev/DIO-430-R1/Firmware/v0.3.0/default_dio_430_r1_plc/default_dio_430_r1_plc.yaml
##
## Requires global `modbus:` with id `modbus_bus`. If UART/Modbus are not defined yet, uncomment:
# uart:
#   id: rs485_uart
#   tx_pin: GPIO4
#   rx_pin: GPIO5
#   baud_rate: 19200
#   parity: NONE
#   stop_bits: 1
# modbus:
#   id: modbus_bus
#   uart_id: rs485_uart
##
## Input Registers (FC=04, read) — contiguous 0..29 (one merged poll per cycle):
##   0 DI_STATE_MASK · 1 RLY_STATE_MASK · 2 BTN_STATE_MASK · 3 LED_STATE_MASK
##   4 STATUS_FLAGS (bit1=linkOk, bit3=cfgDirty) · 5 LOCK_MASK
##   6..29 event counters (EVT_BASE=6, source*4+type; sources DI1..4=0..3, Btn1..2=4..5)
##
## Coils (FC=05/15): 0..2 relays · 3 ALL_OFF · 4 reserved · 5 IDENTIFY
##   6 SAVE_CFG · 7 REBOOT · 8..10 LED_HA · 11..14 DI_LOCK
##
## Relay/LED/lock state in HA: FC04 @1 / @3 / @5 (not coil read-back — ESPHome
## deduplicates FC01 on coils 0..3+5+8..14 and read-back becomes unreliable).
##
## Holding (FC=03) — config/identity; do not poll in the main loop.

substitutions:
  dio_id: dio
  dio_address: "3"
  dio_prefix: "DIO"
  dio_update_interval: 1s
  dio_command_throttle: 0ms

modbus_controller:
  - id: ${dio_id}
    address: ${dio_address}
    modbus_id: modbus_bus
    command_throttle: ${dio_command_throttle}
    update_interval: ${dio_update_interval}

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI1"
    register_type: read
    address: 0
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI2"
    register_type: read
    address: 0
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI3"
    register_type: read
    address: 0
    bitmask: 0x0004
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI4"
    register_type: read
    address: 0
    bitmask: 0x0008

  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Btn1"
    register_type: read
    address: 2
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Btn2"
    register_type: read
    address: 2
    bitmask: 0x0002

  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    id: ${dio_id}_led1_state
    name: "${dio_prefix} LED1"
    register_type: read
    address: 3
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    id: ${dio_id}_led2_state
    name: "${dio_prefix} LED2"
    register_type: read
    address: 3
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    id: ${dio_id}_led3_state
    name: "${dio_prefix} LED3"
    register_type: read
    address: 3
    bitmask: 0x0004

  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Link OK"
    register_type: read
    address: 4
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} Config dirty"
    register_type: read
    address: 4
    bitmask: 0x0008

  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    id: ${dio_id}_di1_lock_state
    name: "${dio_prefix} DI1 lock"
    register_type: read
    address: 5
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    id: ${dio_id}_di2_lock_state
    name: "${dio_prefix} DI2 lock"
    register_type: read
    address: 5
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    id: ${dio_id}_di3_lock_state
    name: "${dio_prefix} DI3 lock"
    register_type: read
    address: 5
    bitmask: 0x0004
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    id: ${dio_id}_di4_lock_state
    name: "${dio_prefix} DI4 lock"
    register_type: read
    address: 5
    bitmask: 0x0008

  # Relay state @ IREG 1 — same FC04 block as DI; used by template switches below
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    id: ${dio_id}_rly1_state
    name: "${dio_prefix} Relay 1 state"
    internal: true
    register_type: read
    address: 1
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    id: ${dio_id}_rly2_state
    name: "${dio_prefix} Relay 2 state"
    internal: true
    register_type: read
    address: 1
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    id: ${dio_id}_rly3_state
    name: "${dio_prefix} Relay 3 state"
    internal: true
    register_type: read
    address: 1
    bitmask: 0x0004

sensor:
  # Event counters: registers 6..29 (all sources × single/double/triple/long)
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI1 single"
    register_type: read
    address: 6
    unit_of_measurement: "events"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI1 double"
    register_type: read
    address: 7
    unit_of_measurement: "events"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI1 triple"
    register_type: read
    address: 8
    unit_of_measurement: "events"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI1 long"
    register_type: read
    address: 9
    unit_of_measurement: "events"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI2 single"
    register_type: read
    address: 10
    unit_of_measurement: "events"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI2 double"
    register_type: read
    address: 11
    unit_of_measurement: "events"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI2 triple"
