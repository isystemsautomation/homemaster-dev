    name: "${dio_prefix} DI2 long"
    register_type: read
    address: 13
    unit_of_measurement: "events"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI3 single"
    register_type: read
    address: 14
    unit_of_measurement: "events"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI3 double"
    register_type: read
    address: 15
    unit_of_measurement: "events"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI3 triple"
    register_type: read
    address: 16
    unit_of_measurement: "events"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} DI3 long"
