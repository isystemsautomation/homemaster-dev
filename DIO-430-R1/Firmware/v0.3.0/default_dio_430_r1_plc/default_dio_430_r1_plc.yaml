switch:
  # Write-only coils — no FC01 read-back (avoids duplicate coil poll blocks)
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    id: ${dio_id}_relay1_coil
    register_type: coil
    address: 0
    internal: true
    assumed_state: true
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    id: ${dio_id}_relay2_coil
    register_type: coil
    address: 1
    internal: true
    assumed_state: true
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    id: ${dio_id}_relay3_coil
    register_type: coil
    address: 2
    internal: true
    assumed_state: true
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    id: ${dio_id}_di1_lock_coil
    register_type: coil
    address: 11
    internal: true
    assumed_state: true
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    id: ${dio_id}_di2_lock_coil
    register_type: coil
    address: 12
    internal: true
    assumed_state: true
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    id: ${dio_id}_di3_lock_coil
    register_type: coil
    address: 13
    internal: true
    assumed_state: true
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    id: ${dio_id}_di4_lock_coil
    register_type: coil
    address: 14
    internal: true
    assumed_state: true
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    id: ${dio_id}_cmd_all_off
    register_type: coil
    address: 3
    internal: true
    assumed_state: true
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    id: ${dio_id}_cmd_identify
    register_type: coil
    address: 5
    internal: true
    assumed_state: true

  # Public switches — state from FC04, command via write-only coils above
  - platform: template
    name: "${dio_prefix} Relay 1"
    id: ${dio_id}_relay1
    lambda: |-
      return id(${dio_id}_rly1_state).state;
    turn_on_action:
      - switch.turn_on: ${dio_id}_relay1_coil
    turn_off_action:
      - switch.turn_off: ${dio_id}_relay1_coil
  - platform: template
    name: "${dio_prefix} Relay 2"
    id: ${dio_id}_relay2
    lambda: |-
      return id(${dio_id}_rly2_state).state;
    turn_on_action:
      - switch.turn_on: ${dio_id}_relay2_coil
    turn_off_action:
      - switch.turn_off: ${dio_id}_relay2_coil
  - platform: template
    name: "${dio_prefix} Relay 3"
    id: ${dio_id}_relay3
    lambda: |-
      return id(${dio_id}_rly3_state).state;
    turn_on_action:
      - switch.turn_on: ${dio_id}_relay3_coil
    turn_off_action:
      - switch.turn_off: ${dio_id}_relay3_coil
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} LED1 HA"
    register_type: coil
    address: 8
    assumed_state: true
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} LED2 HA"
    register_type: coil
    address: 9
    assumed_state: true
  - platform: modbus_controller
    modbus_controller_id: ${dio_id}
    name: "${dio_prefix} LED3 HA"
    register_type: coil
    address: 10
    assumed_state: true
  - platform: template
    name: "${dio_prefix} DI1 child lock"
    lambda: |-
      return id(${dio_id}_di1_lock_state).state;
    turn_on_action:
      - switch.turn_on: ${dio_id}_di1_lock_coil
    turn_off_action:
      - switch.turn_off: ${dio_id}_di1_lock_coil
  - platform: template
    name: "${dio_prefix} DI2 child lock"
    lambda: |-
      return id(${dio_id}_di2_lock_state).state;
    turn_on_action:
      - switch.turn_on: ${dio_id}_di2_lock_coil
    turn_off_action:
      - switch.turn_off: ${dio_id}_di2_lock_coil
  - platform: template
    name: "${dio_prefix} DI3 child lock"
    lambda: |-
      return id(${dio_id}_di3_lock_state).state;
    turn_on_action:
      - switch.turn_on: ${dio_id}_di3_lock_coil
    turn_off_action:
      - switch.turn_off: ${dio_id}_di3_lock_coil
  - platform: template
    name: "${dio_prefix} DI4 child lock"
    lambda: |-
      return id(${dio_id}_di4_lock_state).state;
    turn_on_action:
      - switch.turn_on: ${dio_id}_di4_lock_coil
    turn_off_action:
      - switch.turn_off: ${dio_id}_di4_lock_coil

button:
  - platform: template
    name: "${dio_prefix} All off"
    on_press:
      - switch.turn_on: ${dio_id}_cmd_all_off
  - platform: template
    name: "${dio_prefix} Identify"
    on_press:
      - switch.turn_on: ${dio_id}_cmd_identify
