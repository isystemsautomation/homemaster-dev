# ===================== Command Coils (FC05 write-only) =====================
# Relay coils — no FC01 read-back. Public switches take state from IREG_STATE.
switch:
  - platform: modbus_controller
    modbus_controller_id: ${wld_id}
    id: ${wld_id}_relay1_coil
    name: "${wld_prefix} Relay 1 coil"
    address: 200
    register_type: coil
    internal: true
    assumed_state: true

  - platform: modbus_controller
    modbus_controller_id: ${wld_id}
    id: ${wld_id}_relay2_coil
    name: "${wld_prefix} Relay 2 coil"
    address: 201
    register_type: coil
    internal: true
    assumed_state: true

  - platform: template
    name: "${wld_prefix} Relay 1"
    id: ${wld_id}_relay1
    lambda: |-
      return id(${wld_id}_rly1_state).state;
    turn_on_action:
      - switch.turn_on: ${wld_id}_relay1_coil
    turn_off_action:
      - switch.turn_off: ${wld_id}_relay1_coil

  - platform: template
    name: "${wld_prefix} Relay 2"
    id: ${wld_id}_relay2
    lambda: |-
      return id(${wld_id}_rly2_state).state;
    turn_on_action:
      - switch.turn_on: ${wld_id}_relay2_coil
    turn_off_action:
      - switch.turn_off: ${wld_id}_relay2_coil
