<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 660" width="1200" height="660" xmlns:c2pa="http://c2pa.org/manifest"><rect width="1200" height="660" fill="#fff"/><text x="40" y="52" font-size="28" font-weight="700" fill="#1f2937" text-anchor="start" style="font-family:Roboto,Arial,sans-serif">4 wires at the wall: 24 V DC + the OpenTherm pair</text><rect x="40" y="170" width="220" height="280" rx="14" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/><text x="150" y="250" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle" style="font-family:Roboto,Arial,sans-serif">24 V DC</text><text x="150" y="285" font-size="22" font-weight="400" fill="#4b5563" text-anchor="middle" style="font-family:Roboto,Arial,sans-serif">power supply</text><text x="150" y="315" font-size="20" font-weight="400" fill="#6b7280" text-anchor="middle" style="font-family:Roboto,Arial,sans-serif">SELV, not included</text><text x="70" y="410" font-size="22" font-weight="700" fill="#dc2626" text-anchor="start" style="font-family:Roboto,Arial,sans-serif">+V</text><text x="200" y="410" font-size="22" font-weight="700" fill="#1f2937" text-anchor="start" style="font-family:Roboto,Arial,sans-serif">0V</text><image x="440" y="120" width="300" height="328" xlink:href="data:image/webp;base64,"/><text x="590.0" y="482" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle" style="font-family:Roboto,Arial,sans-serif">OTT-R1 on the wall</text><path d="M260 380 C330 380 400 330 525 330" stroke="#dc2626" stroke-width="5" fill="none"/><path d="M260 400 C330 400 400 345 525 345" stroke="#111827" stroke-width="5" fill="none"/><rect x="900" y="110" width="260" height="380" rx="18" fill="#ffffff" stroke="#9ca3af" stroke-width="3"/><text x="1030" y="170" font-size="30" font-weight="700" fill="#1f2937" text-anchor="middle" style="font-family:Roboto,Arial,sans-serif">Boiler</text><rect x="930" y="330" width="200" height="54" rx="8" fill="#e0ecff" stroke="#0b5ed7" stroke-width="3"/><text x="1030" y="366" font-size="24" font-weight="700" fill="#0b5ed7" text-anchor="middle" style="font-family:Roboto,Arial,sans-serif">OpenTherm</text><rect x="930" y="404" width="200" height="54" rx="8" fill="#fde8e8" stroke="#dc2626" stroke-width="3"/><text x="1030" y="440" font-size="22" font-weight="700" fill="#dc2626" text-anchor="middle" style="font-family:Roboto,Arial,sans-serif">230 V room input</text><path d="M655 330 C760 330 840 350 930 352" stroke="#0b5ed7" stroke-width="5" fill="none"/><path d="M655 345 C760 345 840 364 930 364" stroke="#0b5ed7" stroke-width="5" fill="none" stroke-dasharray="2 0"/><text x="835" y="330" font-size="22" font-weight="700" fill="#0b5ed7" text-anchor="middle" style="font-family:Roboto,Arial,sans-serif">OT+ / OT−</text><text x="40" y="560" font-size="24" font-weight="400" fill="#1f2937" text-anchor="start" style="font-family:Roboto,Arial,sans-serif">OpenTherm: twisted pair, up to 50 m, polarity does not matter.</text><text x="40" y="600" font-size="24" font-weight="700" fill="#dc2626" text-anchor="start" style="font-family:Roboto,Arial,sans-serif">⚠ Many boilers put a 230 V room-thermostat input next to OpenTherm.</text><text x="40" y="636" font-size="22" font-weight="400" fill="#dc2626" text-anchor="start" style="font-family:Roboto,Arial,sans-serif">Identify the OpenTherm terminals before wiring — 230 V destroys the thermostat.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>