##
## ENM-223-R1 — ESPHome Modbus package (v0.2.0 beta)
##
## Contiguous Input Registers FC04 @0..85 (no Discrete Inputs / FC02):
##   A  0 IO_MASK (LED0-3, BTN4-7, RLY8-9)
##      1 STATUS_FLAGS (b1 linkOk, b3 cfgDirty)
##      2 ALARM_FLAGS (bit=3*ch+kind)
##      3..6 CHIP_EV L1/L2/L3/Total (sag1/ov2/loss4/oci8/freq16/rev32)
##   B  7..9 Urms · 10 Freq · 11 Temp · 12..15 PF · 16..18 Angle · 19..21 THD
##   C  22..29 Currents S32 ×0.001 A (Irms L1-3, IrmsN)
##   D  30..53 Powers S32 (P/Q/S × L1-3-T)
##   E  54..85 Energy U32 (AP/AN/RP/RN × L1-3-T)
## Peaks / Pfund / Pharm / VAh / harmonic energy: WebSerial only (not on Modbus).
##
## Coils (DIO-style): write-only — no FC01 read-back.
##   Relay cmds 0-1 · Identify 5 · ACK 16-19. Save/Reboot/Reset-energy NOT on Modbus.
##   Public relays = template (state from IO_MASK FC04). Measurements = one FC04 0..53.
## Parent must supply enm_id / enm_address / enm_prefix (and global modbus_bus).
##

modbus_controller:
  - id: ${enm_id}
    address: ${enm_address}
    modbus_id: modbus_bus
    update_interval: 1s
    command_throttle: 0ms
    allow_duplicate_commands: false

