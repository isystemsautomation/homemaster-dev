modbus_controller:
  - id: ${enm_id}
    address: ${enm_address}        # Modbus slave ID
    modbus_id: modbus_bus
    update_interval: 3s
    command_throttle: 50ms
    allow_duplicate_commands: false

# ===================== Input Registers (FC04) =====================
# NEW MAP (additions only; existing addresses unchanged):
# STATUS_FLAGS @100 (bit1=linkOk, bit3=cfgDirty)
# CHIP_EV @101..104 (U16 bitfield per phase + total):
#   bit0=Sag, bit1=Overvoltage, bit2=Phase loss, bit3=Overcurrent
#   bit4=Frequency (total only), bit5=Reverse phase sequence (total only)

# ===================== Discrete Inputs (FC02) =====================
# NEW MAP:
# LEDs: 0..3 | Buttons: 4..7 | Relays: 8..9 | Alarms: 16..27 (addr = 16 + ch*3 + kind, ch=0..3)
binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Link OK"
    register_type: read
    address: 100
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Config dirty"
    register_type: read
    address: 100
    bitmask: 0x0008

  # --- LED physical states ---
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} LED1"
    address: 0
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} LED2"
    address: 1
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} LED3"
    address: 2
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} LED4"
    address: 3
    register_type: discrete_input

  # --- Buttons pressed ---
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} BTN1"
    address: 4
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} BTN2"
    address: 5
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} BTN3"
    address: 6
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} BTN4"
    address: 7
    register_type: discrete_input

  # --- Relay physical state ---
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Relay 1 State"
    address: 8
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Relay 2 State"
    address: 9
    register_type: discrete_input

  # --- Alarm active flags (kind: 0=Alarm,1=Warning,2=Event), ch: 0=L1,1=L2,2=L3,3=Total ---
  # L1 (16..18)
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Alarm L1 (Alarm)"
    address: 16
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Alarm L1 (Warning)"
    address: 17
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Alarm L1 (Event)"
    address: 18
    register_type: discrete_input

  # L2 (19..21)
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Alarm L2 (Alarm)"
    address: 19
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Alarm L2 (Warning)"
    address: 20
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Alarm L2 (Event)"
    address: 21
    register_type: discrete_input

  # L3 (22..24)
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Alarm L3 (Alarm)"
    address: 22
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Alarm L3 (Warning)"
    address: 23
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Alarm L3 (Event)"
    address: 24
    register_type: discrete_input

  # Total (25..27)
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Alarm Total (Alarm)"
    address: 25
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Alarm Total (Warning)"
    address: 26
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Alarm Total (Event)"
    address: 27
    register_type: discrete_input

  # --- Chip PQ events (decoded ATM90E36 flags, IR 101..104) ---
  # L1 @101
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Chip Sag L1"
    address: 101
    register_type: read
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Chip Overvoltage L1"
    address: 101
    register_type: read
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Chip Phase Loss L1"
    address: 101
    register_type: read
    bitmask: 0x0004
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Chip Overcurrent L1"
    address: 101
    register_type: read
    bitmask: 0x0008

  # L2 @102
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Chip Sag L2"
    address: 102
    register_type: read
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Chip Overvoltage L2"
    address: 102
    register_type: read
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Chip Phase Loss L2"
    address: 102
    register_type: read
    bitmask: 0x0004
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Chip Overcurrent L2"
    address: 102
    register_type: read
    bitmask: 0x0008

  # L3 @103
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Chip Sag L3"
    address: 103
    register_type: read
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Chip Overvoltage L3"
    address: 103
    register_type: read
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Chip Phase Loss L3"
    address: 103
    register_type: read
    bitmask: 0x0004
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Chip Overcurrent L3"
    address: 103
    register_type: read
    bitmask: 0x0008

  # Total @104 (per-phase events OR'd; reverse phase sequence total-only)
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Chip Sag Total"
    address: 104
    register_type: read
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Chip Overvoltage Total"
    address: 104
    register_type: read
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Chip Phase Loss Total"
    address: 104
    register_type: read
    bitmask: 0x0004
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Chip Overcurrent Total"
    address: 104
    register_type: read
    bitmask: 0x0008
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Chip Reverse Phase Sequence"
    address: 104
    register_type: read
    bitmask: 0x0020


# ===================== Coils (FC01/05) =====================
# NEW MAP:
# Relay coils: 0..1
# Service coils: 5 Identify, 6 Save config, 7 Reboot
# Ack coils: 16..19 (write 1 to ACK; device auto-clears to 0)
switch:
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Relay 1"
    address: 0
    register_type: coil
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Relay 2"
    address: 1
    register_type: coil

  # --- Alarm acknowledgements (write 1 to ACK; device auto-clears to 0) ---
  - platform: modbus_controller
    id: ${enm_id}_ack_l1
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} ACK L1"
    address: 16
    register_type: coil
    on_turn_on:
      - delay: 200ms
      - switch.turn_off: ${enm_id}_ack_l1

  - platform: modbus_controller
    id: ${enm_id}_ack_l2
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} ACK L2"
    address: 17
    register_type: coil
    on_turn_on:
      - delay: 200ms
      - switch.turn_off: ${enm_id}_ack_l2

  - platform: modbus_controller
    id: ${enm_id}_ack_l3
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} ACK L3"
    address: 18
    register_type: coil
    on_turn_on:
      - delay: 200ms
      - switch.turn_off: ${enm_id}_ack_l3

  - platform: modbus_controller
    id: ${enm_id}_ack_total
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} ACK Total"
    address: 19
    register_type: coil
    on_turn_on:
      - delay: 200ms
      - switch.turn_off: ${enm_id}_ack_total

  - platform: modbus_controller
    id: ${enm_id}_cmd_identify
    modbus_controller_id: ${enm_id}
    register_type: coil
    address: 5
    internal: true
    assumed_state: true
  - platform: modbus_controller
    id: ${enm_id}_cmd_save_cfg
    modbus_controller_id: ${enm_id}
    register_type: coil
    address: 6
    internal: true
    assumed_state: true
  - platform: modbus_controller
    id: ${enm_id}_cmd_reboot
    modbus_controller_id: ${enm_id}
    register_type: coil
    address: 7
    internal: true
    assumed_state: true

button:
  - platform: template
    name: "${enm_prefix} Identify"
    on_press:
      - switch.turn_on: ${enm_id}_cmd_identify
  - platform: template
    name: "${enm_prefix} Save config"
    on_press:
      - switch.turn_on: ${enm_id}_cmd_save_cfg
  - platform: template
    name: "${enm_prefix} Reboot"
    on_press:
      - switch.turn_on: ${enm_id}_cmd_reboot


# ===================== Sensors (FC04 Input Registers RO) =====================
# NEW MAP:
# Urms: 0..2 (0.01V) | Irms: 3..5 (0.001A)
# Freq: 6 (0.01Hz) | Temp: 7 (int16°C)
# PF raw: 8..11 (x0.001)
# Upeak: 12..14 (0.01V) | Ipeak: 15..17 (0.001A) | IrmsN: 18 (0.001A)
# P (s32): 20/22/24/26  | Q (s32): 28/30/32/34 | S (s32): 36/38/40/42
# Angles: 44..46 (0.1°)
# THD: 47..49 (0.01 %, active-power harmonic ratio)
# Energies (u32 Wh/varh/VAh): base 60 — AP/RP = import, AN/RN = export
# CHIP_EV: 101..104 (U16 bitfield; see binary_sensor section)
sensor:
  # --- RMS ---
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Urms L1"
    address: 0
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - lambda: "return round(x * 100.0f) / 100.0f;"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Urms L2"
    address: 1
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - lambda: "return round(x * 100.0f) / 100.0f;"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Urms L3"
    address: 2
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - lambda: "return round(x * 100.0f) / 100.0f;"

  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Irms L1"
    address: 3
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - lambda: "return round(x * 1000.0f) / 1000.0f;"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Irms L2"
    address: 4
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - lambda: "return round(x * 1000.0f) / 1000.0f;"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Irms L3"
    address: 5
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - lambda: "return round(x * 1000.0f) / 1000.0f;"

  # --- PF (×1000) & Angle (×0.1°) ---
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} PF L1"
    address: 8
    register_type: read
    value_type: S_WORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - lambda: "return round(x * 1000.0f) / 1000.0f;"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} PF L2"
    address: 9
    register_type: read
    value_type: S_WORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - lambda: "return round(x * 1000.0f) / 1000.0f;"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} PF L3"
    address: 10
    register_type: read
    value_type: S_WORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - lambda: "return round(x * 1000.0f) / 1000.0f;"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} PF Total"
    address: 11
    register_type: read
    value_type: S_WORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - lambda: "return round(x * 1000.0f) / 1000.0f;"

  # --- Peaks (hardware SagPeakDetCfg) & neutral current ---
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Upeak L1"
    address: 12
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - lambda: "return round(x * 100.0f) / 100.0f;"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Upeak L2"
    address: 13
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - lambda: "return round(x * 100.0f) / 100.0f;"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Upeak L3"
    address: 14
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - lambda: "return round(x * 100.0f) / 100.0f;"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Ipeak L1"
    address: 15
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - lambda: "return round(x * 1000.0f) / 1000.0f;"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Ipeak L2"
    address: 16
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - lambda: "return round(x * 1000.0f) / 1000.0f;"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Ipeak L3"
    address: 17
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - lambda: "return round(x * 1000.0f) / 1000.0f;"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Irms Neutral"
    address: 18
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - lambda: "return round(x * 1000.0f) / 1000.0f;"

  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Angle L1"
    address: 44
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "°"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - lambda: "return round(x * 10.0f) / 10.0f;"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Angle L2"
    address: 45
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "°"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - lambda: "return round(x * 10.0f) / 10.0f;"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Angle L3"
    address: 46
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "°"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - lambda: "return round(x * 10.0f) / 10.0f;"

  # --- THD (active-power harmonic ratio, 0.01 %) ---
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} THD L1"
    address: 47
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - lambda: "return round(x * 100.0f) / 100.0f;"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} THD L2"
    address: 48
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - lambda: "return round(x * 100.0f) / 100.0f;"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} THD L3"
    address: 49
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - lambda: "return round(x * 100.0f) / 100.0f;"

  # --- Frequency & Temperature ---
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Line Frequency"
    address: 6
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "Hz"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - lambda: "return round(x * 100.0f) / 100.0f;"

  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Temperature"
    address: 7
    register_type: read
    value_type: S_WORD
    unit_of_measurement: "°C"

  # --- P/Q/S (s32, whole watts/var/VA) ---
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} P L1"
    address: 20
    register_type: read
    value_type: S_DWORD
    unit_of_measurement: "W"
    accuracy_decimals: 0
    filters:
      - lambda: "return (float) ((int) round(x));"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} P L2"
    address: 22
    register_type: read
    value_type: S_DWORD
    unit_of_measurement: "W"
    accuracy_decimals: 0
    filters:
      - lambda: "return (float) ((int) round(x));"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} P L3"
    address: 24
    register_type: read
    value_type: S_DWORD
    unit_of_measurement: "W"
    accuracy_decimals: 0
    filters:
      - lambda: "return (float) ((int) round(x));"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} P Total"
    address: 26
    register_type: read
    value_type: S_DWORD
    unit_of_measurement: "W"
    accuracy_decimals: 0
    filters:
      - lambda: "return (float) ((int) round(x));"

  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Q L1"
    address: 28
    register_type: read
    value_type: S_DWORD
    unit_of_measurement: "var"
    accuracy_decimals: 0
    filters:
      - lambda: "return (float) ((int) round(x));"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Q L2"
    address: 30
    register_type: read
    value_type: S_DWORD
    unit_of_measurement: "var"
    accuracy_decimals: 0
    filters:
      - lambda: "return (float) ((int) round(x));"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Q L3"
    address: 32
    register_type: read
    value_type: S_DWORD
    unit_of_measurement: "var"
    accuracy_decimals: 0
    filters:
      - lambda: "return (float) ((int) round(x));"
