# ===================== Coils — write-only (DIO pattern, no FC01 read-back) =====================
switch:
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    id: ${enm_id}_relay1_coil
    register_type: coil
    address: 0
    internal: true
    assumed_state: true
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    id: ${enm_id}_relay2_coil
    register_type: coil
    address: 1
    internal: true
    assumed_state: true
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    id: ${enm_id}_cmd_identify
    register_type: coil
    address: 5
    internal: true
    assumed_state: true
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    id: ${enm_id}_ack_l1_coil
    register_type: coil
    address: 16
    internal: true
    assumed_state: true
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    id: ${enm_id}_ack_l2_coil
    register_type: coil
    address: 17
    internal: true
    assumed_state: true
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    id: ${enm_id}_ack_l3_coil
    register_type: coil
    address: 18
    internal: true
    assumed_state: true
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    id: ${enm_id}_ack_total_coil
    register_type: coil
    address: 19
    internal: true
    assumed_state: true

  # Public relays: state from IO_MASK (FC04), command via write-only coils
  - platform: template
    name: "${enm_prefix} Relay 1"
    id: ${enm_id}_relay1
    lambda: |-
      return id(${enm_id}_relay1_state).state;
    turn_on_action:
      - switch.turn_on: ${enm_id}_relay1_coil
    turn_off_action:
      - switch.turn_off: ${enm_id}_relay1_coil
  - platform: template
    name: "${enm_prefix} Relay 2"
    id: ${enm_id}_relay2
    lambda: |-
      return id(${enm_id}_relay2_state).state;
    turn_on_action:
      - switch.turn_on: ${enm_id}_relay2_coil
    turn_off_action:
      - switch.turn_off: ${enm_id}_relay2_coil

button:
  - platform: template
    name: "${enm_prefix} Identify"
    on_press:
      - switch.turn_on: ${enm_id}_cmd_identify
  - platform: template
    name: "${enm_prefix} ACK L1"
    on_press:
      - switch.turn_on: ${enm_id}_ack_l1_coil
  - platform: template
    name: "${enm_prefix} ACK L2"
    on_press:
      - switch.turn_on: ${enm_id}_ack_l2_coil
  - platform: template
    name: "${enm_prefix} ACK L3"
    on_press:
      - switch.turn_on: ${enm_id}_ack_l3_coil
  - platform: template
    name: "${enm_prefix} ACK Total"
    on_press:
      - switch.turn_on: ${enm_id}_ack_total_coil

