# ===================== Coils (FC01/05) — unchanged =====================
switch:
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Relay 1"
    address: 0
    register_type: coil
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Relay 2"
    address: 1
    register_type: coil

  - platform: modbus_controller
    id: ${enm_id}_ack_l1
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} ACK L1"
    address: 16
    register_type: coil
    on_turn_on:
      - delay: 200ms
      - switch.turn_off: ${enm_id}_ack_l1

  - platform: modbus_controller
    id: ${enm_id}_ack_l2
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} ACK L2"
    address: 17
    register_type: coil
    on_turn_on:
      - delay: 200ms
      - switch.turn_off: ${enm_id}_ack_l2

  - platform: modbus_controller
    id: ${enm_id}_ack_l3
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} ACK L3"
    address: 18
    register_type: coil
    on_turn_on:
      - delay: 200ms
      - switch.turn_off: ${enm_id}_ack_l3

  - platform: modbus_controller
    id: ${enm_id}_ack_total
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} ACK Total"
    address: 19
    register_type: coil
    on_turn_on:
      - delay: 200ms
      - switch.turn_off: ${enm_id}_ack_total

  - platform: modbus_controller
    id: ${enm_id}_cmd_identify
    modbus_controller_id: ${enm_id}
    register_type: coil
    address: 5
    internal: true
    assumed_state: true
  - platform: modbus_controller
    id: ${enm_id}_cmd_save_cfg
    modbus_controller_id: ${enm_id}
    register_type: coil
    address: 6
    internal: true
    assumed_state: true
  - platform: modbus_controller
    id: ${enm_id}_cmd_reboot
    modbus_controller_id: ${enm_id}
    register_type: coil
    address: 7
    internal: true
    assumed_state: true
  - platform: modbus_controller
    id: ${enm_id}_cmd_reset_energy
    modbus_controller_id: ${enm_id}
    register_type: coil
    address: 8
    internal: true
    assumed_state: true

button:
  - platform: template
    name: "${enm_prefix} Identify"
    on_press:
      - switch.turn_on: ${enm_id}_cmd_identify
  - platform: template
    name: "${enm_prefix} Save config"
    on_press:
      - switch.turn_on: ${enm_id}_cmd_save_cfg
  - platform: template
    name: "${enm_prefix} Reboot"
    on_press:
      - switch.turn_on: ${enm_id}_cmd_reboot
  - platform: template
    name: "${enm_prefix} Reset energy counters"
    on_press:
      - switch.turn_on: ${enm_id}_cmd_reset_energy

sensor:
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Urms L1"
    address: 7
    register_type: read
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - lambda: "return round(x * 100.0f) / 100.0f;"
  - platform: modbus_controller
    modbus_controller_id: ${enm_id}
    name: "${enm_prefix} Urms L2"
