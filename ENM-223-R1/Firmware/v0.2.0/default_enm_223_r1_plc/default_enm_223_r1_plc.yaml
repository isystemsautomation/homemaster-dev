##
## ENM-223-R1 — ESPHome Modbus package (v0.2.0 beta)
##
## Contiguous Input Registers FC04 @0..126 (no Discrete Inputs / FC02):
##   A  0 IO_MASK (LED0-3, BTN4-7, RLY8-9)
##      1 STATUS_FLAGS (b1 linkOk, b3 cfgDirty)
##      2 ALARM_FLAGS (bit=3*ch+kind)
##      3..6 CHIP_EV L1/L2/L3/Total (sag1/ov2/loss4/oci8/freq16/rev32)
##   B  7..9 Urms · 10 Freq · 11 Temp · 12..15 PF · 16..18 Angle · 19..21 THD · 22..24 Upeak
##   C  25..38 Currents S32 ×0.001 A (Irms L1-3, IrmsN, Ipeak L1-3)
##   D  39..78 Powers S32 (P/Q/S/Pfund/Pharm × L1-3-T)
##   E  79..126 Energy U32 (AP/AN/RP/RN/SA/APH × L1-3-T)
##
## Coils / Holding unchanged (relays 0-1, service 5-8, ack 16-19, HR addr/baud/…).
## Parent must supply enm_id / enm_address / enm_prefix (and global modbus_bus).
##

modbus_controller:
  - id: ${enm_id}
    address: ${enm_address}
    modbus_id: modbus_bus
    update_interval: 3s
    command_throttle: 50ms
    allow_duplicate_commands: false

binary_sensor:
