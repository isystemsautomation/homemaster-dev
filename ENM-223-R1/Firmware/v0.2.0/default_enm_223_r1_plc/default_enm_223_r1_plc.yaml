  # --- Net energy (import − export), derived ---
  - platform: template
    name: "${enm_prefix} Active Energy Net Total"
    unit_of_measurement: "Wh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 0
    lambda: |-
      if (!id(${enm_id}_e_ap_total).has_state() || !id(${enm_id}_e_an_total).has_state()) return {};
      return id(${enm_id}_e_ap_total).state - id(${enm_id}_e_an_total).state;
  - platform: template
    name: "${enm_prefix} Reactive Energy Net Total"
    unit_of_measurement: "varh"
    state_class: total_increasing
    accuracy_decimals: 0
    lambda: |-
      if (!id(${enm_id}_e_rp_total).has_state() || !id(${enm_id}_e_rn_total).has_state()) return {};
      return id(${enm_id}_e_rp_total).state - id(${enm_id}_e_rn_total).state;

