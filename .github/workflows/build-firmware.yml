# Build all HomeMaster RP2350 module firmware (v0.2.0) with arduino-cli.
# Produces .uf2 binaries and --dump-profile output for pinning sketch.yaml versions.
name: Build firmware (v0.2.0)

on:
  push:
    paths:
      - '**/Firmware/v0.2.0/**'
      - '.github/workflows/build-firmware.yml'
  pull_request:
    paths:
      - '**/Firmware/v0.2.0/**'
      - '.github/workflows/build-firmware.yml'

env:
  BOARD_MANAGER_URL: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
  FQBN: rp2040:rp2040:generic_rp2350:flash=2097152_1048576

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: AIO-422-R1
            sketch: default_aio_422_r1
            extra_libs: '"ADS1X15@0.6.2" "Adafruit MAX31865 library@1.6.2" "Adafruit MCP4725@2.0.2" "Adafruit BusIO@1.17.4"'
          - module: ALM-173-R1
            sketch: default_alm_173_r1
            extra_libs: '"PCF8574@0.4.5"'
          - module: DIM-420-R1
            sketch: default_DIM_420_R1
            extra_libs: ''
          - module: DIO-430-R1
            sketch: default_DIO_430_R1
            extra_libs: ''
          - module: ENM-223-R1
            sketch: default_enm_223_r1
            extra_libs: ''
          - module: RGB-621-R1
            sketch: default_rgb_621_r1
            extra_libs: ''
          - module: WLD-521-R1
            sketch: default_wld-521-r1
            extra_libs: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Configure board manager
        run: arduino-cli config add board_manager.additional_urls "${{ env.BOARD_MANAGER_URL }}"

      - name: Install RP2040 core
        run: |
          arduino-cli core update-index
          arduino-cli core install rp2040:rp2040@5.6.0

      - name: Install libraries
        run: |
          # Modbus-Serial needs Modbus-Arduino for <Modbus.h>. OneWire (WLD) ships with arduino-pico core.
          arduino-cli lib install \
            "Arduino_JSON@0.2.0" \
            "Modbus-Arduino@1.3.0" \
            "Modbus-Serial@2.0.6" \
            "Simple Web Serial@1.0.0" \
            ${{ matrix.extra_libs }}

      - name: Compile ${{ matrix.module }} / ${{ matrix.sketch }}
        working-directory: ${{ matrix.module }}/Firmware/v0.2.0/${{ matrix.sketch }}
        run: |
          arduino-cli compile \
            --fqbn "${{ env.FQBN }}" \
            --export-binaries \
            --dump-profile \
            . 2>&1 | tee profile-dump.txt

      - name: Generate SBOM (CycloneDX)
        working-directory: ${{ matrix.module }}/Firmware/v0.2.0/${{ matrix.sketch }}
        run: |
          python3 "${GITHUB_WORKSPACE}/tools/sbom_arduino.py" \
            --module "${{ matrix.module }}" \
            --sketch "${{ matrix.sketch }}" \
            --profile profile-dump.txt \
            --fw-version 0.2.0 \
            --out "${{ matrix.module }}.cdx.json"

      - name: Validate SBOM
        working-directory: ${{ matrix.module }}/Firmware/v0.2.0/${{ matrix.sketch }}
        run: |
          # Fail the build if the SBOM is not valid CycloneDX or has no components.
          python3 - "${{ matrix.module }}.cdx.json" <<'PY'
          import json, sys
          b = json.load(open(sys.argv[1]))
          assert b.get("bomFormat") == "CycloneDX", "not CycloneDX"
          assert b.get("components"), "SBOM has no components"
          print(f"SBOM OK: {len(b['components'])} components")
          PY

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.sketch }}
          path: |
            ${{ matrix.module }}/Firmware/v0.2.0/${{ matrix.sketch }}/build/**/*.uf2
            ${{ matrix.module }}/Firmware/v0.2.0/${{ matrix.sketch }}/profile-dump.txt
            ${{ matrix.module }}/Firmware/v0.2.0/${{ matrix.sketch }}/${{ matrix.module }}.cdx.json
          if-no-files-found: error
