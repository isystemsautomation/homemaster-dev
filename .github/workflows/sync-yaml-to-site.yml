name: Sync ESPHome YAML to site

on:
  push:
    branches:
      - main
    paths:
      - '**/Firmware/**.yaml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-site
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout site
        uses: actions/checkout@v4
        with:
          ref: site
          path: site
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy Firmware YAML from main
        id: sync
        run: |
          set -euo pipefail
          shopt -s nullglob

          echo "Copying */Firmware/*.yaml from main to site"
          for src in main/*/Firmware/*.yaml; do
            rel="${src#main/}"
            mkdir -p "site/$(dirname "$rel")"
            cp -a "$src" "site/$rel"
            echo "copy $rel"
          done

          echo "Removing */Firmware/*.yaml that main no longer has"
          for dst in site/*/Firmware/*.yaml; do
            rel="${dst#site/}"
            if [[ ! -f "main/$rel" ]]; then
              git -C site rm -f -- "$rel"
              echo "remove $rel"
            fi
          done

          git -C site add -- ':(glob)*/Firmware/*.yaml'
          echo "Staged:"
          git -C site diff --cached --name-status

          if git -C site diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Firmware YAML changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push site
        if: steps.sync.outputs.changed == 'true'
        working-directory: site
        env:
          COMMIT_MSG: |
            Sync ESPHome configuration from main

            Generated by sync-yaml-to-site.yml. The configurations are
            edited in main, which is what ESPHome clones; this copy exists
            so they are also visible beside the rest of each module's
            firmware on the branch GitHub Pages serves. Do not edit it here.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$COMMIT_MSG"
          git push origin HEAD:site
