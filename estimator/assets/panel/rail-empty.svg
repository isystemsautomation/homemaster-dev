<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="70" height="360" viewBox="0 0 70 360">
  <defs>
    <linearGradient id="railFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8ccd0"/>
      <stop offset="45%" stop-color="#aeb4ba"/>
      <stop offset="100%" stop-color="#8e959c"/>
    </linearGradient>
    <linearGradient id="railShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="35%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="70" height="360" fill="url(#railFace)"/>
  <rect x="0" y="0" width="70" height="360" fill="url(#railShade)"/>
  <!-- hat-rail groove suggestion -->
  <rect x="8" y="168" width="54" height="10" rx="1.5" fill="#6d737a" opacity="0.55"/>
  <rect x="8" y="182" width="54" height="6" rx="1" fill="#d7dbe1" opacity="0.35"/>
  <line x1="0.5" y1="0" x2="0.5" y2="360" stroke="#7a8086" stroke-width="1" opacity="0.4"/>
  <line x1="69.5" y1="0" x2="69.5" y2="360" stroke="#7a8086" stroke-width="1" opacity="0.4"/>
</svg>
