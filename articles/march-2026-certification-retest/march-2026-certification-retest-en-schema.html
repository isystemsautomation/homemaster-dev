      "name": "Which directives does each product comply with?",
      "acceptedAnswer": { "@type": "Answer", "text": "EMC (2014/30/EU) and RoHS (2011/65/EU) apply to every product in the lineup. LVD (2014/35/EU) applies to every product where mains-level voltage can be present — that includes the modules with mains inputs (MiniPLC AC, OpenTherm AC, DIM, ENM) and also every module whose relay contacts can switch user-supplied mains up to 250 V AC (MiniPLC, MicroPLC, OpenTherm, ENM, ALM, DIO, RGB, WLD). Nine of eleven products are under LVD scope; the AIO-422-R1 (pure analog and SELV) and the STR-3221-R1 (MOSFET LED outputs only) are the two outside it. RED (2014/53/EU) applies to the three Wi-Fi products: MiniPLC, MicroPLC, and OpenTherm Gateway." }
    },
    {
      "@type": "Question",
      "name": "Why was LVD done in our own lab rather than at an external accredited laboratory?",
      "acceptedAnswer": { "@type": "Answer", "text": "Directive 2014/35/EU lets the manufacturer self-declare LVD conformity under Module A — internal production control — without a notified body. The methodology and pass criteria are taken verbatim from EN 62368-1:2020 plus A11:2020, the test equipment is calibrated against ISO 17025-traceable references, and the test sequences plus raw data are filed with the report. If any measurement falls within 10 percent of a limit or any single-fault outcome is unclear, an external accredited laboratory is consulted before the report is signed." }
