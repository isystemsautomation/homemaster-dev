esphome:
  name: homemaster-opentherm-934ca0   # Full device name (as in the adopted config) -> homemaster-opentherm-934ca0.local resolves, so OTA reaches it
  name_add_mac_suffix: false
  friendly_name: HomeMaster OpenTherm Gateway
  project:
    name: homemaster.opentherm_gateway
    version: "1.0.7"

esp32:
  variant: esp32
  board: esp32dev
  flash_size: 16MB
  framework:
    type: esp-idf

logger:

api:

wifi:
  ap:
    ssid: "HomeMaster OT Fallback"

captive_portal:

esp32_improv:
  authorizer: none

improv_serial:

ota:
  - platform: esphome

opentherm:
  id: ot_bus
  in_pin: GPIO21
  out_pin: GPIO26

binary_sensor:
  - platform: status
    id: esp_status
    name: "ESP Status"
    entity_category: diagnostic

  - platform: gpio
    id: button_1
    name: "Button"
    pin:
      number: GPIO35
      inverted: true
      mode:
        input: true

  - platform: opentherm
    fault_indication:
      id: ot_fault_indication
      name: "Boiler Fault Indication"
      entity_category: diagnostic
    flame_on:
      id: ot_flame_on
      name: "Boiler Flame On"
    ch_active:
      id: ot_ch_active
      name: "Boiler CH Active"
    dhw_active:
      id: ot_dhw_active
      name: "Boiler DHW Active"
    service_request:
      id: ot_service_request
      name: "Boiler Service Request"
      entity_category: diagnostic
    lockout_reset:
      id: ot_lockout_reset
      name: "Boiler Lockout Reset"
      entity_category: diagnostic
    low_water_pressure:
      id: ot_low_water_pressure
      name: "Boiler Low Water Pressure"
      entity_category: diagnostic
    flame_fault:
      id: ot_flame_fault
      name: "Boiler Flame Fault"
      entity_category: diagnostic
    air_pressure_fault:
      id: ot_air_pressure_fault
      name: "Boiler Air Pressure Fault"
      entity_category: diagnostic
    water_over_temp:
      id: ot_water_over_temp
      name: "Boiler Water Overtemperature"
      entity_category: diagnostic
    dhw_setpoint_transfer_enabled:
      id: ot_dhw_setpoint_transfer_enabled
      name: "Boiler DHW Setpoint Transfer Enabled"
      entity_category: diagnostic
    max_ch_setpoint_transfer_enabled:
      id: ot_max_ch_setpoint_transfer_enabled
      name: "Boiler Max CH Setpoint Transfer Enabled"
      entity_category: diagnostic
    dhw_setpoint_rw:
      id: ot_dhw_setpoint_rw
      name: "Boiler DHW Setpoint RW"
      entity_category: diagnostic
    max_ch_setpoint_rw:
      id: ot_max_ch_setpoint_rw
      name: "Boiler Max CH Setpoint RW"
      entity_category: diagnostic
    diagnostic_indication:
      id: ot_diagnostic_indication
      name: "Boiler Diagnostic Indication"
      entity_category: diagnostic
      disabled_by_default: true

one_wire:
  - platform: gpio
    id: ow_bus_1
    pin: GPIO4
  - platform: gpio
    id: ow_bus_2
    pin: GPIO5

sensor:
  - platform: uptime
    id: esp_uptime
    internal: true
    update_interval: 60s

  - platform: wifi_signal
    id: wifi_signal_db
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: internal_temperature
    id: esp32_temperature
    name: "ESP32 Temperature"
    update_interval: 60s
    entity_category: diagnostic

  - platform: opentherm
    t_boiler:
      id: ot_t_boiler
      name: "Boiler Water Temperature"
      unit_of_measurement: "°C"
    rel_mod_level:
      id: ot_rel_mod_level
      name: "Boiler Relative Modulation Level"
      unit_of_measurement: "%"
    t_ret:
      id: ot_t_ret
      name: "Boiler Return Temperature"
      unit_of_measurement: "°C"
      disabled_by_default: true
    t_dhw:
      id: ot_t_dhw
      name: "Boiler DHW Temperature"
      unit_of_measurement: "°C"
      disabled_by_default: true
    t_outside:
      id: ot_t_outside
      name: "Boiler Outside Temperature"
      unit_of_measurement: "°C"
      disabled_by_default: true
    ch_pressure:
      id: ot_ch_pressure
      name: "Boiler CH Pressure"
      unit_of_measurement: "bar"
      disabled_by_default: true
    dhw_flow_rate:
      id: ot_dhw_flow_rate
      name: "Boiler DHW Flow Rate"
      unit_of_measurement: "l/min"
      disabled_by_default: true
    t_collector:
      id: ot_t_collector
      name: "Boiler Collector Temperature"
      unit_of_measurement: "°C"
      disabled_by_default: true
    t_flow_ch2:
      id: ot_t_flow_ch2
      name: "Boiler CH2 Flow Temperature"
      unit_of_measurement: "°C"
      disabled_by_default: true
    t_dhw2:
      id: ot_t_dhw2
      name: "Boiler DHW2 Temperature"
      unit_of_measurement: "°C"
      disabled_by_default: true
    t_exhaust:
      id: ot_t_exhaust
      name: "Boiler Exhaust Temperature"
      unit_of_measurement: "°C"
      disabled_by_default: true

  - platform: dallas_temp
    id: ow_bus_1_temperature
    one_wire_id: ow_bus_1
    name: "Outdoor Temperature"          # outdoor sensor on 1-Wire bus 1
    unit_of_measurement: "°C"
    update_interval: 30s

  - platform: dallas_temp
    id: ow_bus_2_temperature
    one_wire_id: ow_bus_2
    name: "1-Wire Bus 2 Temperature"
    unit_of_measurement: "°C"

  # ===== Room temperatures from Home Assistant =====
  # External thermostat (reference room, lower floor) and upper floor. Replace entity_id with your own.
  - platform: homeassistant
    id: ref_room_temp
    name: "Reference Room Temperature"
    entity_id: sensor.living_room_temperature

  - platform: homeassistant
    id: upper_room_temp
    name: "Upper Floor Temperature"
    # Aggregated upstairs temperature computed in HA (mean / lowest of the upstairs
    # sensors). The 2nd floor heats unevenly - warm air from the underfloor-heated
    # ground floor rises into it - so we drive the valve from a robust aggregate,
    # not a single probe. See the HA min_max/template example in the guide.
    entity_id: sensor.upper_floor_temperature

  # ===== WATER SETPOINT =====
  # 1) Base: outdoor->flow curve via the native calibrate_linear filter (2 points)
  - platform: copy
    source_id: ow_bus_1_temperature
    id: curve_flow
    internal: true
    filters:
      - calibrate_linear:
          - -15.0 -> 60.0      # -15 outside -> 60 C water  (tune the curve here)
          -  18.0 -> 28.0      # +18 outside -> 28 C water
  # 2) Result = curve + external-thermostat correction, then clamp 20..80
  #    room_influence = 1.0 -> a 1 C room error shifts the flow target by 1 C
  - platform: template
    id: ch_target_flow
    name: "CH Target Flow"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      float base = id(curve_flow).state;                 // water from the curve
      if (isnan(base)) return NAN;
      float corr = 0;
      if (!isnan(id(ref_room_temp).state))               // correction from the external thermostat:
        corr = id(room_influence).state *                //   K * (target - actual)
               (id(ref_room_target).state - id(ref_room_temp).state);
      float v = base + corr;
      if (v < 20) v = 20;                                 // boiler CH setpoint limits
      if (v > 80) v = 80;
      return v;
    on_value:
      then:
        - if:
            condition:
              switch.is_on: auto_mode      # in MANUAL mode we don't touch the setpoint - you set it yourself
            then:
              - number.set:
                  id: ot_t_set
                  value: !lambda 'return x;'    # AUTO: push the computed value to the boiler setpoint

switch:
  - platform: opentherm
    # NOTE: boiler on/off (CH Enable) is intentionally NOT automated in this config.
    # A separate thermostat in Home Assistant - driven by the fireplace/chimney
    # controller (MiniPLC + WLD-521-R1) - decides when the gas boiler may fire, based
    # on fireplace operation, the heating air-conditioners (heat pumps), a heating
    # schedule, and the room setpoint. An HA automation mirrors that demand onto this
    # CH Enable. This gateway only sets the water temperature and the upper-floor valve.
    ch_enable:
      id: ot_ch_enable
      name: "Boiler CH Enable"
      restore_mode: RESTORE_DEFAULT_ON
    dhw_enable:
      id: ot_dhw_enable
      name: "Boiler DHW Enable"
      restore_mode: RESTORE_DEFAULT_ON
    cooling_enable:
      id: ot_cooling_enable
      name: "Boiler Cooling Enable"
      disabled_by_default: true
    otc_active:
      id: ot_otc_active
      name: "Boiler OTC Active"
      disabled_by_default: true
    ch2_active:
      id: ot_ch2_active
      name: "Boiler CH2 Active"
      disabled_by_default: true
    summer_mode_active:
      id: ot_summer_mode_active
      name: "Boiler Summer Mode Active"
      disabled_by_default: true
    dhw_block:
      id: ot_dhw_block
      name: "Boiler DHW Block"
      disabled_by_default: true

  - platform: gpio
    id: relay_1
    name: "Relay (Upper Floor Valve)"
    pin: GPIO32

  # ===== AUTO / MANUAL switch =====
  # ON  = automation controls the water setpoint and the upper-floor valve.
  # OFF = manual: you control "Boiler CH Setpoint" and "Relay (Upper Floor Valve)" in HA.
  - platform: template
    id: auto_mode
    name: "Heating Auto Mode"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

number:
  - platform: opentherm
    t_set:
      id: ot_t_set
      name: "Boiler CH Setpoint"
      min_value: 20
      max_value: 80
      step: 1
    t_dhw_set:
      id: ot_t_dhw_set
      name: "Boiler DHW Setpoint"
      min_value: 35
      max_value: 65
      step: 1
    max_t_set:
      id: ot_max_t_set
      name: "Boiler Max CH Setpoint"
      min_value: 30
      max_value: 85
      step: 1
      disabled_by_default: true
    max_rel_mod_level:
      id: ot_max_rel_mod_level
      name: "Boiler Max Relative Modulation Level"
      min_value: 0
      max_value: 100
      step: 1
      disabled_by_default: true
    otc_hc_ratio:
      id: ot_otc_hc_ratio
      name: "Boiler OTC Heat Curve Ratio"
      min_value: 0
      max_value: 127
      step: 1
      disabled_by_default: true

  # ===== External-thermostat correction settings =====
  - platform: template
    id: ref_room_target
    name: "Reference Room Target"
    unit_of_measurement: "°C"
    optimistic: true
    restore_value: true
    initial_value: 21
    min_value: 5
    max_value: 28
    step: 0.5

  - platform: template
    id: room_influence
    name: "Room Influence (K/K)"        # how many C of water to shift per 1 C of room deviation
    optimistic: true
    restore_value: true
    initial_value: 3
    min_value: 0
    max_value: 10
    step: 0.5

# ===== UPPER-FLOOR VALVE (native thermostat, hysteresis built in) =====
# A climate card with the upper-floor temperature slider appears in HA.
# Heating = open valve, satisfied = close. Does NOT touch the burner.
climate:
  - platform: thermostat
    name: "Heating Upper Floor"
    sensor: upper_room_temp
    min_idle_time: 30s
    min_heating_off_time: 300s
    min_heating_run_time: 300s
    heat_deadband: 0.3       # open at (target - 0.3)
    heat_overrun: 0.3        # close at (target + 0.3)
    heat_action:
      - if:
          condition:
            switch.is_on: auto_mode
          then:
            - switch.turn_off: relay_1   # AUTO: OPEN valve (relay is NC: OFF = NC closed = energized). If your valve is NO, swap with idle_action.
    idle_action:
      - if:
          condition:
            switch.is_on: auto_mode
          then:
            - switch.turn_on: relay_1    # AUTO: CLOSE valve
    default_preset: Home
    preset:
      - name: Home
        default_target_temperature_low: 21 °C
    visual:
      min_temperature: 5 °C
      max_temperature: 28 °C
      temperature_step: 0.5 °C

text_sensor:
  - platform: template
    id: esp_uptime_human
    name: "ESP Uptime Human"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      if (isnan(id(esp_uptime).state)) {
        return {};
      }
      int total_seconds = (int) id(esp_uptime).state;
      int days = total_seconds / 86400;
      int hours = (total_seconds % 86400) / 3600;
      if (days > 0) {
        return {to_string(days) + "d " + to_string(hours) + "h"};
      }
      int minutes = (total_seconds % 3600) / 60;
      if (hours > 0) {
        return {to_string(hours) + "h " + to_string(minutes) + "m"};
      }
      return {to_string(minutes) + "m"};

  - platform: version
    id: esphome_version
    name: "ESPHome Version"
    entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      id: esp_ip_address
      name: "ESP IP Address"
      entity_category: diagnostic

status_led:
  pin:
    number: GPIO33
    inverted: true
