##
## RGB-621-R1 — ESPHome Modbus package (v0.2.0)
##
## Include per module with unique vars (rgb_id, rgb_address, rgb_prefix):
##   packages:
##     rgb1:
##       url: github://isystemsautomation/homemaster-dev/RGB-621-R1/Firmware/v0.2.0/default_rgb_621_r1_plc/default_rgb_621_r1_plc.yaml
##       vars:
##         rgb_id: rgb1
##         rgb_address: "3"
##         rgb_prefix: "RGB Living"
##
## Modbus map (matches default_rgb_621_r1.ino v0.2.0):
##   Input Registers (FC04): 4 STATUS_FLAGS (bit1=linkOk, bit3=cfgDirty)
##   Discrete Inputs (FC02): 1..2 DI · 60 relay · 90..91 LED
##   Coils (FC05/15): 5 IDENTIFY · 6 SAVE_CFG · 7 REBOOT
##                    200 relay ON · 210 relay OFF · 300..301 DI enable · 320..321 DI disable
##   Holding (FC03): 400..404 PWM R,G,B,WW,CW · 480 MB addr · 481 MB baud
##   Identity IR (FC04): 200..204 MODEL_ID, FW_MAJOR/MINOR/PATCH, MAP_VERSION

substitutions:
  rgb_id: rgb
  rgb_address: "3"
  rgb_prefix: "RGB"
  rgb_update_interval: 1s
  rgb_command_throttle: 0ms

modbus_controller:
  - id: ${rgb_id}
    address: ${rgb_address}
    modbus_id: modbus_bus
    update_interval: ${rgb_update_interval}
    command_throttle: ${rgb_command_throttle}

# ===================== Input Registers (FC04) =====================
binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: ${rgb_id}
    name: "${rgb_prefix} Link OK"
    register_type: read
    address: 4
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${rgb_id}
    name: "${rgb_prefix} Config dirty"
    register_type: read
    address: 4
    bitmask: 0x0008

# ===================== Discrete Inputs (FC02) =====================
  - platform: modbus_controller
    modbus_controller_id: ${rgb_id}
    name: "${rgb_prefix} DI1"
    address: 1
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${rgb_id}
    name: "${rgb_prefix} DI2"
    address: 2
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${rgb_id}
    name: "${rgb_prefix} Relay1 State"
    address: 60
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${rgb_id}
    name: "${rgb_prefix} LED1"
    address: 90
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${rgb_id}
    name: "${rgb_prefix} LED2"
    address: 91
    register_type: discrete_input

# ===================== Coils (FC05/15) =====================
switch:
  # Service (pulse)
  - platform: modbus_controller
    modbus_controller_id: ${rgb_id}
    id: ${rgb_id}_cmd_identify
    register_type: coil
    address: 5
    internal: true
    assumed_state: true
  - platform: modbus_controller
    modbus_controller_id: ${rgb_id}
    id: ${rgb_id}_cmd_save_cfg
    register_type: coil
    address: 6
    internal: true
    assumed_state: true
  - platform: modbus_controller
    modbus_controller_id: ${rgb_id}
    id: ${rgb_id}_cmd_reboot
    register_type: coil
    address: 7
    internal: true
    assumed_state: true

  # Relay command pulses
  - platform: modbus_controller
    id: ${rgb_id}_rly1_on
    modbus_controller_id: ${rgb_id}
    name: "${rgb_prefix} Relay1 ON (Pulse)"
    address: 200
    register_type: coil
    on_turn_on:
      - delay: 200ms
      - switch.turn_off: ${rgb_id}_rly1_on

  - platform: modbus_controller
    id: ${rgb_id}_rly1_off
    modbus_controller_id: ${rgb_id}
    name: "${rgb_prefix} Relay1 OFF (Pulse)"
    address: 210
    register_type: coil
    on_turn_on:
      - delay: 200ms
      - switch.turn_off: ${rgb_id}_rly1_off

number:
  # -------- RGB Channels (0–255), HR 400..402 --------
  - platform: modbus_controller
    name: "${rgb_prefix} Red"
    id: ${rgb_id}_red
    modbus_controller_id: ${rgb_id}
    address: 400
    register_type: holding
    value_type: U_WORD
    min_value: 0
    max_value: 255
    step: 1

  - platform: modbus_controller
    name: "${rgb_prefix} Green"
    id: ${rgb_id}_green
    modbus_controller_id: ${rgb_id}
    address: 401
    register_type: holding
    value_type: U_WORD
    min_value: 0
    max_value: 255
    step: 1

  - platform: modbus_controller
    name: "${rgb_prefix} Blue"
    id: ${rgb_id}_blue
    modbus_controller_id: ${rgb_id}
    address: 402
    register_type: holding
    value_type: U_WORD
    min_value: 0
    max_value: 255
    step: 1

  # -------- CCT Channels (0–255), HR 403..404 --------
  - platform: modbus_controller
    name: "${rgb_prefix} Warm White"
    id: ${rgb_id}_ww
    modbus_controller_id: ${rgb_id}
    address: 403
    register_type: holding
    value_type: U_WORD
    min_value: 0
    max_value: 255
    step: 1

  - platform: modbus_controller
    name: "${rgb_prefix} Cool White"
    id: ${rgb_id}_cw
    modbus_controller_id: ${rgb_id}
    address: 404
    register_type: holding
    value_type: U_WORD
    min_value: 0
    max_value: 255
    step: 1

button:
  - platform: template
    name: "${rgb_prefix} Identify"
    on_press:
      - switch.turn_on: ${rgb_id}_cmd_identify
  - platform: template
    name: "${rgb_prefix} Save config"
    on_press:
      - switch.turn_on: ${rgb_id}_cmd_save_cfg
  - platform: template
    name: "${rgb_prefix} Reboot"
    on_press:
      - switch.turn_on: ${rgb_id}_cmd_reboot

#############################################################
# TEMPLATE OUTPUTS FOR RGBWW LIGHT (also write HR 400–404)
#############################################################
output:
  - platform: modbus_controller
    id: ${rgb_id}_out_r
    modbus_controller_id: ${rgb_id}
    address: 400
    register_type: holding
    value_type: U_WORD
    multiply: 255.0

  - platform: modbus_controller
    id: ${rgb_id}_out_g
    modbus_controller_id: ${rgb_id}
    address: 401
    register_type: holding
    value_type: U_WORD
    multiply: 255.0

  - platform: modbus_controller
    id: ${rgb_id}_out_b
    modbus_controller_id: ${rgb_id}
    address: 402
    register_type: holding
    value_type: U_WORD
    multiply: 255.0

  - platform: modbus_controller
    id: ${rgb_id}_out_ww
    modbus_controller_id: ${rgb_id}
    address: 403
    register_type: holding
    value_type: U_WORD
    multiply: 255.0

  - platform: modbus_controller
    id: ${rgb_id}_out_cw
    modbus_controller_id: ${rgb_id}
    address: 404
    register_type: holding
    value_type: U_WORD
    multiply: 255.0

#############################################################
# RGBWW LIGHT (uses the 5 template outputs above)
#############################################################
light:
  - platform: rgbww
    id: ${rgb_id}_light
    name: "${rgb_prefix} Light"
    red: ${rgb_id}_out_r
    green: ${rgb_id}_out_g
    blue: ${rgb_id}_out_b
    warm_white: ${rgb_id}_out_ww
    cold_white: ${rgb_id}_out_cw
    warm_white_color_temperature: 2700 K
    cold_white_color_temperature: 6500 K
