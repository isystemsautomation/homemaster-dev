##
## RGB-621-R1 — ESPHome Modbus package (v0.2.0)
##
## Bus-load notes (shared RS-485 with DIO/ENM):
##   - DI/relay/LED/linkOk: one FC04 poll @0 count=5 (IREG 0..4), not sparse FC02.
##   - PWM outputs are write-only (skip_updates=max); control via rgbww Light.
##   - Relay/service coils are write-only (assumed_state); pulse via template buttons.
##
## Include per module with unique vars (rgb_id, rgb_address, rgb_prefix):
##   packages:
##     rgb1:
##       url: github://isystemsautomation/homemaster-dev/RGB-621-R1/Firmware/v0.2.0/default_rgb_621_r1_plc/default_rgb_621_r1_plc.yaml
##       vars:
##         rgb_id: rgb1
##         rgb_address: "3"
##         rgb_prefix: "RGB Living"
##
## Modbus map (default_rgb_621_r1.ino v0.2.0, MAP_VERSION=2):
##   Input Registers (FC04) 0..4:
##     0 DI_STATE_MASK · 1 RLY_STATE_MASK · 2 reserved · 3 LED_STATE_MASK · 4 STATUS_FLAGS
##   Discrete Inputs (FC02) 1..2, 60, 90..91 — legacy mirror, do not poll from ESPHome
##   Coils (FC05/15): 5 IDENTIFY · 6 SAVE_CFG · 7 REBOOT
##                    200 relay ON · 210 relay OFF · 300..301 DI enable · 320..321 DI disable
##   Holding (FC03): 400..404 PWM R,G,B,WW,CW (write via Light) · 480 MB addr · 481 MB baud

substitutions:
  rgb_id: rgb
  rgb_address: "3"
  rgb_prefix: "RGB"
  rgb_update_interval: 5s
  rgb_command_throttle: 50ms
  rgb_pwm_skip_updates: "65535"

modbus_controller:
  - id: ${rgb_id}
    address: ${rgb_address}
    modbus_id: modbus_bus
    update_interval: ${rgb_update_interval}
    command_throttle: ${rgb_command_throttle}

# ===================== Input Registers (FC04) @0..4 — one merged poll =====================
binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: ${rgb_id}
    name: "${rgb_prefix} DI1"
    register_type: read
    address: 0
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${rgb_id}
    name: "${rgb_prefix} DI2"
    register_type: read
    address: 0
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${rgb_id}
    name: "${rgb_prefix} Relay1 State"
    register_type: read
    address: 1
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${rgb_id}
    name: "${rgb_prefix} LED1"
    register_type: read
    address: 3
    bitmask: 0x0001
  - platform: modbus_controller
    modbus_controller_id: ${rgb_id}
    name: "${rgb_prefix} LED2"
    register_type: read
    address: 3
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${rgb_id}
    name: "${rgb_prefix} Link OK"
    register_type: read
    address: 4
    bitmask: 0x0002
  - platform: modbus_controller
    modbus_controller_id: ${rgb_id}
    name: "${rgb_prefix} Config dirty"
    register_type: read
    address: 4
    bitmask: 0x0008

# ===================== Coils (FC05/15) — write-only, no FC01 read-back =====================
switch:
  - platform: modbus_controller
    modbus_controller_id: ${rgb_id}
    id: ${rgb_id}_cmd_identify
    register_type: coil
    address: 5
    internal: true
    assumed_state: true
  - platform: modbus_controller
    modbus_controller_id: ${rgb_id}
    id: ${rgb_id}_cmd_save_cfg
    register_type: coil
    address: 6
    internal: true
    assumed_state: true
  - platform: modbus_controller
    modbus_controller_id: ${rgb_id}
    id: ${rgb_id}_cmd_reboot
    register_type: coil
    address: 7
    internal: true
    assumed_state: true
  - platform: modbus_controller
    modbus_controller_id: ${rgb_id}
    id: ${rgb_id}_rly1_on_coil
    register_type: coil
    address: 200
    internal: true
    assumed_state: true
  - platform: modbus_controller
    modbus_controller_id: ${rgb_id}
    id: ${rgb_id}_rly1_off_coil
    register_type: coil
    address: 210
    internal: true
    assumed_state: true

button:
  - platform: template
    name: "${rgb_prefix} Identify"
    on_press:
      - switch.turn_on: ${rgb_id}_cmd_identify
  - platform: template
    name: "${rgb_prefix} Save config"
    on_press:
      - switch.turn_on: ${rgb_id}_cmd_save_cfg
  - platform: template
    name: "${rgb_prefix} Reboot"
    on_press:
      - switch.turn_on: ${rgb_id}_cmd_reboot
  - platform: template
    name: "${rgb_prefix} Relay1 ON (Pulse)"
    on_press:
      - switch.turn_on: ${rgb_id}_rly1_on_coil
      - delay: 200ms
      - switch.turn_off: ${rgb_id}_rly1_on_coil
  - platform: template
    name: "${rgb_prefix} Relay1 OFF (Pulse)"
    on_press:
      - switch.turn_on: ${rgb_id}_rly1_off_coil
      - delay: 200ms
      - switch.turn_off: ${rgb_id}_rly1_off_coil

#############################################################
# PWM outputs — write-only (skip_updates); rgbww Light below
#############################################################
output:
  - platform: modbus_controller
    id: ${rgb_id}_out_r
    modbus_controller_id: ${rgb_id}
    address: 400
    register_type: holding
    value_type: U_WORD
    multiply: 255.0
    skip_updates: ${rgb_pwm_skip_updates}

  - platform: modbus_controller
    id: ${rgb_id}_out_g
    modbus_controller_id: ${rgb_id}
    address: 401
    register_type: holding
    value_type: U_WORD
    multiply: 255.0
    skip_updates: ${rgb_pwm_skip_updates}

  - platform: modbus_controller
    id: ${rgb_id}_out_b
    modbus_controller_id: ${rgb_id}
    address: 402
    register_type: holding
    value_type: U_WORD
    multiply: 255.0
    skip_updates: ${rgb_pwm_skip_updates}

  - platform: modbus_controller
    id: ${rgb_id}_out_ww
    modbus_controller_id: ${rgb_id}
    address: 403
    register_type: holding
    value_type: U_WORD
    multiply: 255.0
    skip_updates: ${rgb_pwm_skip_updates}

  - platform: modbus_controller
    id: ${rgb_id}_out_cw
    modbus_controller_id: ${rgb_id}
    address: 404
    register_type: holding
    value_type: U_WORD
    multiply: 255.0
    skip_updates: ${rgb_pwm_skip_updates}

#############################################################
# RGBWW LIGHT (writes HR 400–404 via outputs above)
#############################################################
light:
  - platform: rgbww
    id: ${rgb_id}_light
    name: "${rgb_prefix} Light"
    red: ${rgb_id}_out_r
    green: ${rgb_id}_out_g
    blue: ${rgb_id}_out_b
    warm_white: ${rgb_id}_out_ww
    cold_white: ${rgb_id}_out_cw
    warm_white_color_temperature: 2700 K
    cold_white_color_temperature: 6500 K
