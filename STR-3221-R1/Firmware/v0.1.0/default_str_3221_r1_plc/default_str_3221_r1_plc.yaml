##
## STR-3221-R1 — ESPHome Modbus package (v0.1.0)
##
## Include from your ESPHome YAML (requires global modbus: id modbus_bus):
##   packages:
##     str1:
##       url: https://github.com/isystemsautomation/homemaster-dev
##       ref: main
##       files:
##         - path: STR-3221-R1/Firmware/v0.1.0/default_str_3221_r1_plc/default_str_3221_r1_plc.yaml
##           vars:
##             str_prefix: "STR#1"
##             str_id: str_1
##             str_address: 21
##
## Modbus map (see default_str_3221_r1.ino):
##   DI  1..3    IO1..IO3
##   DI  20..23  BUTTON1..4
##   DI  90..91  LED1..2
##   HR  400..431 O1..O32 brightness 0..255
##   HR  480/481 Modbus address / baud
##   IR  200..204 firmware identity

substitutions:
  str_id: str
  str_address: "21"
  str_prefix: "STR"
  str_update_interval: 1s
  str_command_throttle: 0ms

modbus_controller:
  - id: ${str_id}
    address: ${str_address}
    modbus_id: modbus_bus
    update_interval: ${str_update_interval}
    command_throttle: ${str_command_throttle}

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: ${str_id}
    name: "${str_prefix} IO1"
    address: 1
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${str_id}
    name: "${str_prefix} IO2"
    address: 2
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${str_id}
    name: "${str_prefix} IO3"
    address: 3
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${str_id}
    name: "${str_prefix} Button1"
    address: 20
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${str_id}
    name: "${str_prefix} Button2"
    address: 21
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${str_id}
    name: "${str_prefix} Button3"
    address: 22
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${str_id}
    name: "${str_prefix} Button4"
    address: 23
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${str_id}
    name: "${str_prefix} Status LED1"
    address: 90
    register_type: discrete_input
  - platform: modbus_controller
    modbus_controller_id: ${str_id}
    name: "${str_prefix} Status LED2"
    address: 91
    register_type: discrete_input

