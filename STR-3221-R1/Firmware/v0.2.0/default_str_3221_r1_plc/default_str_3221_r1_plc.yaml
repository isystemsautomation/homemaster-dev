##
## STR-3221-R1 — ESPHome Modbus package (v0.2.0 beta)
##
## Include from your ESPHome YAML (requires global modbus: id modbus_bus):
##   packages:
##     str1:
##       url: https://github.com/isystemsautomation/homemaster-dev
##       ref: main
##       files:
##         - path: STR-3221-R1/Firmware/v0.2.0/default_str_3221_r1_plc/default_str_3221_r1_plc.yaml
##           vars:
##             str_prefix: "STR#1"
##             str_id: str_1
##             str_address: 3
##
## Input Registers (FC=04, read) — contiguous 0..31 (one merged poll per cycle):
##   0 DI_MASK · 1 BTN_MASK · 2 LED_MASK · 3 STATUS_FLAGS
##      (bit0=tlcReady, bit1=linkOk, bit2=busFailsafe, bit3=cfgDirty,
##       bit4=localOverride, bit5=panic, bit6=seqRunning, bit7=heatDemand)
##   4 TLC_MASK · 5 I2C_ERRORS · 6 RESET_REASON · 7 LINK_AGE_S · 8 UPTIME_MIN
##   9 ACTIVE_SCENE (0=none, 1..8=last recalled)
##  10..25 OUT readback (2 channels per reg, low=even high=odd)
##  26 SEQ_STATE · 27 SEQ_STEP · 28 HEAT_FLAGS · 29 ZONES_OPEN
##  30 ZONE_MASK_LO · 31 ZONE_MASK_HI
##     HEAT_FLAGS: bit2=DI closed · bit3=frost · bit4=valve exercise
##
## Holding (FC=03/06/16): 400..431 O1..O32 · 432 master 0..255 · 433 inhibit
##   · 434 night level · 435 day level · 436 scene recall (write 1..8, reads back 0)
##   · 437 summer mode.
## Coils: 330 save levels · 331 release override · 332 panic · 333 all-off · 334 clear panic
##   · 340 run up · 341 run down · 342 stop · 345 exercise valves now.
## IR 200..204: firmware identity (not polled).
##
## Heat channels: this package exposes O1..O32 as monochromatic lights (0–255)
## because one YAML covers every profile. For a zone that is profile=heat, the
## firmware reads HR 400..431 as 0–100 % duty. To show those zones as sliders
## in HA, comment the matching `light:` entries and uncomment the `number:`
## block at the bottom (0–100, unit %). Mixing both for the same register
## double-writes the holding register — pick one per channel.
##
## Output readback @ IR 10..25 is registered and polled (internal sensors below);
## monochromatic lights are driven by HR 400..431 writes. Wiring readback into
## light entity state is deferred (RGB v0.3.0 needed a dedicated fix for that).

substitutions:
  str_id: str
  str_address: "3"
  str_prefix: "STR"
  str_update_interval: 1s
  str_command_throttle: 0ms

modbus_controller:
  - id: ${str_id}
    address: ${str_address}
    modbus_id: modbus_bus
    update_interval: ${str_update_interval}
    command_throttle: ${str_command_throttle}

