<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" font-family="Roboto, Arial, sans-serif"><rect width="1200" height="480" fill="#F5F6F8"/><g transform="translate(0,-80)"><rect x="60" y="200" width="320" height="300" rx="18" fill="#FFFFFF" stroke="#E6E8EE" stroke-width="1"/><g transform="translate(172,240) scale(1.5)"><rect x="18" y="4" width="28" height="56" rx="5" fill="none" stroke="#0B1220" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 52 H36" fill="none" stroke="#0B1220" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 20 q8 -6 16 0 M27 26 q5 -4 10 0" stroke="#0B5ED7" stroke-width="2.6" fill="none"/><circle cx="32" cy="32" r="2.5" fill="#0B5ED7"/></g><text x="220" y="400" fill="#0B1220" font-size="20" font-weight="700" text-anchor="middle">1  Wi-Fi via Improv</text><text x="220" y="432" fill="#5B667A" font-size="15" font-weight="400" text-anchor="middle">USB-C or Bluetooth, from a browser</text><rect x="440" y="200" width="320" height="300" rx="18" fill="#FFFFFF" stroke="#E6E8EE" stroke-width="1"/><g transform="translate(552,240) scale(1.5)"><rect x="4" y="8" width="56" height="38" rx="4" fill="none" stroke="#0B1220" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 56 H40 M32 46 V56" fill="none" stroke="#0B1220" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 38 L22 26 L30 32 L40 18 L52 28" stroke="#0B5ED7" stroke-width="2.6" fill="none"/></g><text x="600" y="400" fill="#0B1220" font-size="20" font-weight="700" text-anchor="middle">2  Appears in Home Assistant</text><text x="600" y="432" fill="#5B667A" font-size="15" font-weight="400" text-anchor="middle">discovered automatically, click Add</text><rect x="820" y="200" width="320" height="300" rx="18" fill="#F5F6F8" stroke="#9AA3B2" stroke-width="2" stroke-dasharray="8 6"/><g transform="translate(932,240) scale(1.5)" opacity="0.7"><rect x="12" y="10