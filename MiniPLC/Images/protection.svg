<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Roboto, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <g id="shield">
      <path d="M0 -16 L13 -11 L13 1 C13 9 7 15 0 18 C-7 15 -13 9 -13 1 L-13 -11 Z" fill="#0B5ED7"/>
      <path d="M-6 1 L-1 6 L7 -4" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="1200" height="720" fill="#F5F6F8"/>

  <!-- board outline -->
  <rect x="400" y="230" width="400" height="260" rx="14" fill="#FFFFFF" stroke="#C9CED8" stroke-width="2"/>
  <rect x="420" y="250" width="360" height="220" rx="8" fill="none" stroke="#E6E8EE" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="560" y="320" width="80" height="80" rx="6" fill="#0B1220"/>
  <text x="600" y="366" fill="#E6E8EE" font-size="15" font-weight="700" text-anchor="middle">ESP32</text>

  <!-- zone markers on board -->
  <g>
    <rect x="420" y="250" width="110" height="60" rx="6" fill="#E8F0FC"/>
    <rect x="670" y="250" width="110" height="60" rx="6" fill="#E8F0FC"/>
    <rect x="420" y="410" width="110" height="60" rx="6" fill="#E8F0FC"/>
    <rect x="670" y="410" width="110" height="60" rx="6" fill="#E8F0FC"/>
    <use href="#shield" x="475" y="280"/>
    <use href="#shield" x="725" y="280"/>
    <use href="#shield" x="475" y="440"/>
    <use href="#shield" x="725" y="440"/>
  </g>
  <g stroke="#9AA3B2" stroke-width="2" fill="none">
    <line x1="530" y1="280" x2="560" y2="340"/>
    <line x1="670" y1="280" x2="640" y2="340"/>
    <line x1="530" y1="440" x2="560" y2="380"/>
    <line x1="670" y1="440" x2="640" y2="380"/>
  </g>

  <!-- leaders to cards -->
  <g stroke="#5B667A" stroke-width="1.2" fill="none">
    <polyline points="420,280 380,280 380,150 360,150"/>
    <polyline points="780,280 820,280 820,150 840,150"/>
    <polyline points="420,440 380,440 380,560 360,560"/>
    <polyline points="780,440 820,440 820,560 840,560"/>
  </g>

  <!-- cards -->
  <g font-size="15" fill="#334155">
    <g>
      <rect x="40" y="80" width="320" height="150" rx="12" fill="#FFFFFF" stroke="#E6E8EE"/>
      <use href="#shield" x="72" y="116"/>
      <text x="96" y="122" fill="#0B1220" font-size="19" font-weight="700">Mains input (L / N)</text>
      <text x="64" y="158">EMI filter</text>
      <text x="64" y="180">Varistors and fuses</text>
      <text x="64" y="202">X2 capacitor</text>
    </g>
    <g>
      <rect x="840" y="80" width="320" height="150" rx="12" fill="#FFFFFF" stroke="#E6E8EE"/>
      <use href="#shield" x="872" y="116"/>
      <text x="896" y="122" fill="#0B1220" font-size="19" font-weight="700">Relay outputs</text>
      <text x="864" y="158">Optocoupler-isolated drive</text>
      <text x="864" y="180">Varistor on every contact</text>
      <text x="864" y="202">3 A per output, contactor above</text>
    </g>
    <g>
      <rect x="40" y="490" width="320" height="172" rx="12" fill="#FFFFFF" stroke="#E6E8EE"/>
      <use href="#shield" x="72" y="526"/>
      <text x="96" y="532" fill="#0B1220" font-size="19" font-weight="700">Digital inputs</text>
      <text x="64" y="568">TVS surge suppression</text>
      <text x="64" y="590">Resettable fuse per channel</text>
      <text x="64" y="612">Reverse-polarity protection</text>
      <text x="64" y="634">EMI filter per channel</text>
    </g>
    <g>
      <rect x="840" y="490" width="320" height="194" rx="12" fill="#FFFFFF" stroke="#E6E8EE"/>
      <use href="#shield" x="872" y="526"/>
      <text x="896" y="532" fill="#0B1220" font-size="19" font-weight="700">RS-485</text>
      <text x="864" y="568">3× TVS (A–COM, B–COM, A–B)</text>
      <text x="864" y="590">2× PTC 1.5 A on A and B</text>
      <text x="864" y="612">Common-mode choke</text>
      <text x="864" y="634">Fail-safe bias on board</text>
      <text x="864" y="664" fill="#5B667A" font-size="14">Surge protection, not galvanic isolation</text>
    </g>
  </g>
</svg>
