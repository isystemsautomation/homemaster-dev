# ALM-173-R1 — ESPHome Modbus package (MAP v3, firmware 0.2.0)
##
## Input Registers (FC04, read) — contiguous @0..3 (one merged poll per cycle):
##   0 IN1..IN16 mask · 1 IN17/Any/G1-G3/Relay1-3/LED1-4/Armed/Entry/Exit/Tamper
##   2 Zone1..16 latched · 3 Zone17 latched
##
## Coils (FC01/05) — contiguous @0..48:
##   0..16 enable IN · 17..33 disable IN · 34..36 relay ON · 37..39 relay OFF
##   40 Ack All · 41..43 Ack G1-G3 · 44..46 alarm pulse G1-G3 · 47 ARM · 48 DISARM
##
## Identity (FC04) @200 — MODEL_ID, FW version, MAP_VERSION (read once; not in package).

substitutions:
  alm_id: alm
  alm_address: "3"
  alm_prefix: "ALM"
  alm_update_interval: 500ms
  alm_command_throttle: 0ms

modbus_controller:
  - id: ${alm_id}
    address: ${alm_address}
    modbus_id: modbus_bus
    command_throttle: ${alm_command_throttle}
    update_interval: ${alm_update_interval}

